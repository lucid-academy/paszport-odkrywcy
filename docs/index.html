<!-- Paszport Odkrywcy Bydgoskiego Przedmieścia — cyfrowa wersja gry terenowej.
     Treść: Toruńska Agenda Kulturalna / Kulturalny hub, opr. Zuzanna Falleńczyk.
     Demo techniczne: Fundacja Lucid Academy. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paszport Odkrywcy Bydgoskiego Przedmieścia</title>
<style>
:root{
  --pap:#E6D9C6; --pap2:#DACDBA; --pap3:#C9BAA3;
  --ink:#312D2A; --ink2:#6B5E4E; --ink3:#8B7B65;
  --azur:#007FFF; --ceg:#7A4A3A;
  --disp:Didot,"Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Times New Roman",Times,Georgia,serif;
  --util:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--pap);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(rgba(120,95,60,.07) .6px,transparent .6px),radial-gradient(rgba(80,60,40,.05) .5px,transparent .5px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
.app{max-width:560px;margin:0 auto;padding:0 0 96px;position:relative}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--azur);outline-offset:2px}
.hr{height:1px;background:var(--pap3);margin:0 18px}

/* running head */
.rh{padding:14px 18px 0;text-align:center}
.rh small{font-family:var(--util);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.rh h1{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.03em;line-height:.9;
  font-size:clamp(30px,9.5vw,46px);margin:8px 0 6px}
.rh .strip{font-family:var(--util);font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink2);margin:0 0 12px}

/* dark nav bar — jak paski TRASA w oryginale */
.trasa{background:var(--ink);color:var(--pap);font-family:var(--util);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:9px 18px;line-height:1.5}
.trasa b{color:#fff;font-weight:700}

.pad{padding:18px}
h2.pt{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1;
  font-size:clamp(23px,6.4vw,32px);margin:14px 0 4px}
.addr{font-family:var(--util);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ceg);margin:0 0 2px}
.rozp{background:var(--pap2);border-left:3px solid var(--azur);padding:10px 13px;margin:12px 0;font-size:15px}
.rozp b{font-family:var(--util);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:3px;font-weight:600}
.mikro{font-family:var(--util);font-size:10px;letter-spacing:.18em;text-transform:uppercase;text-align:center;
  color:var(--ink2);margin:22px 0 10px;font-weight:600}

/* ikonografia */
figure.f{margin:13px 0 0}
figure.f img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;
  background:var(--pap2);border:1px solid var(--pap3)}
figure.f.mini img{width:auto;max-width:118px;margin:0 auto;border:0;background:none}
figure.f figcaption{font-family:var(--util);font-size:10px;line-height:1.6;letter-spacing:.04em;
  color:var(--ink3);margin-top:5px;text-align:left}
details.pod{margin:10px 0 0}
details.pod>summary{list-style:none;font-family:var(--util);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ceg);cursor:pointer;padding:3px 0}
details.pod>summary::-webkit-details-marker{display:none}
details.pod[open]>summary{color:var(--ink3)}
.cover figure.f{margin:18px 0 0}
.hist p{margin:0 0 11px;text-align:justify;hyphens:auto}
.hist{font-size:15.5px}
details.rys{margin:14px 0 0}
details.rys>summary{list-style:none;background:none;border:1px solid var(--ink);border-radius:2px;padding:11px 14px;
  font-family:var(--util);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:var(--ink)}
details.rys>summary::-webkit-details-marker{display:none}
details.rys[open]>summary{border-color:var(--pap3);color:var(--ink3);margin-bottom:8px}

/* zadania */
.zad{margin:6px 0 0}
.q{border-top:1px solid var(--pap3);padding:15px 0 4px}
.q p{margin:0 0 9px;font-size:15.5px}
.q .qn{font-family:var(--util);font-size:9.5px;letter-spacing:.16em;color:var(--azur);text-transform:uppercase;display:block;margin-bottom:5px}
input[type=text],input[type=number],textarea{width:100%;background:transparent;border:0;border-bottom:1.5px dotted var(--ink2);
  font-family:var(--body);font-size:16px;color:var(--ink);padding:6px 2px;resize:vertical}
textarea{border:1.5px dotted var(--ink2);border-radius:2px;padding:9px;min-height:70px}
input:focus,textarea:focus{outline:none;border-color:var(--azur);border-style:solid}
.wyb{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.wyb button{text-align:left;background:transparent;border:1px solid var(--pap3);border-radius:2px;padding:10px 12px;font-size:15px;color:var(--ink2)}
.wyb button[aria-pressed=true]{border-color:var(--azur);background:rgba(0,127,255,.07);color:var(--ink)}
.foto{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.foto label{background:var(--ink);color:var(--pap);border-radius:2px;padding:10px 15px;font-family:var(--util);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.foto input{display:none}
.foto img{width:76px;height:76px;object-fit:cover;border:1px solid var(--pap3)}
.foto .del{background:none;border:0;color:var(--ceg);font-family:var(--util);font-size:10px;letter-spacing:.1em;text-transform:uppercase}

/* słowniczek */
.slow{margin:20px 0 0;border:1px dashed var(--pap3);border-radius:2px;padding:12px 14px}
.slow b{font-family:var(--util);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:7px}
.slow dt{font-family:var(--util);font-size:12px;font-weight:700;letter-spacing:.03em;margin-top:7px}
.slow dd{margin:1px 0 0;font-size:14px;color:var(--ink2)}
.slow dl{margin:0}

/* nawigacja dolna */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);z-index:9}
.navin{max-width:560px;margin:0 auto;display:flex;align-items:stretch}
.nav button{flex:1;background:none;border:0;color:var(--pap);font-family:var(--util);font-size:10.5px;
  letter-spacing:.11em;text-transform:uppercase;padding:15px 8px}
.nav button:disabled{color:#6a635c}
.nav .mid{flex:0 0 92px;border-left:1px solid #4a443e;border-right:1px solid #4a443e;font-family:var(--util);
  color:var(--pap);font-size:10px;letter-spacing:.08em;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.nav .mid b{font-family:var(--disp);font-size:19px;letter-spacing:0;line-height:1}
.prog{height:3px;background:#4a443e}
.prog i{display:block;height:100%;background:var(--azur);transition:width .3s}

/* mapa */
svg.tr{display:block;width:100%;height:auto;background:var(--pap2);border:1px solid var(--pap3)}
.stop{cursor:pointer}
.legend{font-family:var(--util);font-size:10px;letter-spacing:.06em;color:var(--ink3);padding:8px 2px;display:flex;gap:14px;flex-wrap:wrap}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}

/* start / koniec */
.cover{padding:26px 18px 8px;text-align:center}
.cover .line{margin:16px auto 20px;max-width:420px}
.zasady li{font-size:15px;margin:0 0 9px;text-align:left}
.zasady{padding-left:20px;margin:8px 0 0}
.cta{display:block;width:100%;background:var(--azur);color:#fff;border:0;border-radius:2px;padding:15px;
  font-family:var(--util);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:18px}
.cta.gh{background:transparent;color:var(--ink);border:1px solid var(--ink);margin-top:9px}
.cert{border:2px solid var(--ink);padding:24px 20px;text-align:center;margin-top:6px;background:rgba(255,255,255,.22)}
.cert h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:23px;font-weight:400;margin:0 0 4px;line-height:1.1}
.cert .sub{font-family:var(--util);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin:0 0 20px}
.cert input{text-align:center;font-family:var(--disp);font-size:24px;border-bottom-style:solid;border-color:var(--ink2)}
.cert .cap{font-family:var(--util);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:5px 0 22px}
.cert .txt{font-size:14.5px;line-height:1.6;margin:0 0 14px}
.zrodla{font-family:var(--util);font-size:11px;line-height:1.9;color:var(--ink2);overflow-wrap:break-word}
.zrodla b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:10px 0 4px}
.zrodla a{color:var(--ink2)}
.sumbox{margin-top:22px}
.sumq{border-top:1px solid var(--pap3);padding:11px 0}
.sumq .k{font-family:var(--util);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.sumq .v{font-size:15.5px;margin-top:2px}
.sumq .v.pusto{color:var(--ceg);font-style:italic}
.sumq img{width:64px;height:64px;object-fit:cover;border:1px solid var(--pap3);margin-top:5px}
.uwaga{background:var(--pap2);border-left:3px solid var(--ceg);padding:11px 13px;font-size:14.5px;margin:16px 0}
.stopka{font-family:var(--util);font-size:9.5px;letter-spacing:.08em;color:var(--ink3);text-align:center;
  padding:26px 18px 0;line-height:1.8}
.stopka p{margin:0}
.sygnwrap{border-top:1px solid var(--pap3);margin:15px 18px 0;padding-top:15px}
a.sygn{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink3)}
a.sygn img{width:52px;height:36px;object-fit:contain;display:block;flex:0 0 52px}
a.sygn span{text-align:left;line-height:1.75}
a.sygn b{color:var(--ink2);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
a.sygn u{text-decoration:none;border-bottom:1px solid var(--pap3)}
a.sygn:hover u{border-bottom-color:var(--ink3)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="rh">
    <small>„Paszport Odkrywcy Bydgoskiego Przedmieścia”</small>
    <h1>Bydgoskie<br>Przedmieście</h1>
    <p class="strip">Historia · Architektura · Sztuka</p>
  </div>
  <div id="view"></div>
  <div class="stopka" id="stopka"></div>
</div>

<nav class="nav" id="nav" hidden>
  <div class="prog"><i id="progbar"></i></div>
  <div class="navin">
    <button id="bPrev" onclick="go(-1)">← Wstecz</button>
    <button class="mid" onclick="show('mapa')"><b id="midn">1</b><span>mapa</span></button>
    <button id="bNext" onclick="go(1)">Dalej →</button>
  </div>
</nav>

<script>
/* ————— treść gry ————— */
const ZASADY=[
"Gra nie wymaga aplikacji ani przewodnika — wystarczysz Ty i oczy szeroko otwarte.",
"Twoim zadaniem jest dotarcie w okolice wskazanych skrzyżowań lub ulic, a następnie odnalezienie konkretnego budynku na podstawie wskazówek. Szukaj rzeźb, detali lub tablic rejestru zabytków.",
"Dopiero gdy będziesz pewien, że stoisz przed właściwym obiektem, odsłoń historię budynku.",
"Na każdym przystanku czeka zestaw pytań. Odpowiedzi zapisujesz tutaj — na końcu pokażesz je w recepcji hubu.",
"Powodzenia!"];

const G={ // słowniczek
 szachulec:"Typ budowli drewnianej, w której pola między belkami wypełnia się innym materiałem — u nas cegłą.",
 eklektyzm:"Styl łączący elementy różnych stylów architektonicznych w spójną całość.",
 putto:"Motyw dekoracyjny: mały nagi chłopiec albo sama jego głowa, często uskrzydlony.",
 nereida:"W mitologii greckiej nimfa morska, córka Nereusa i Doris.",
 kartusz:"Ozdobne obramowanie tarczy herbowej, monogramu, napisu lub malowidła.",

};

const P=[
{n:1,x:430,y:430,skrz:"ul. Bydgoska 50-52",adres:"ul. Bydgoska 50-52",
 trasa:"Punkt startowy — Kulturalny hub",
 rozp:"Stoisz przed hubem. To ten budynek z konstrukcją ryglową i narożnym wykuszem.",
 hist:["Czy wiesz, że budynek, przed którym stoisz, ma ponad 120 lat i skrywa niesamowitą historię? To dzieło oraz dom rodzinny Konrada Schwartza — niezwykle zdolnego budowniczego. W części z numerem 50 zamieszkał sam ze swoją żoną Gabrielą, córką dawnego burmistrza Torunia, a w numerze 52 urządził luksusowe mieszkania.",
 "Przez wiele lat ludzie myśleli, że historia pana Konrada skończyła się przed II wojną światową. Niedawno odkryto jednak niesamowitą prawdę. Kiedy w Niemczech do władzy doszedł Adolf Hitler, zięć pana Konrada — mąż jego najstarszej córki Anny — został ważnym politykiem. Pan Konrad i jego córka byli tak odważni i prawi, że nie dali się oszukać złym ideom. Rozmawiali z nim tak długo, aż zięć zrozumiał swój błąd, sprzeciwił się Hitlerowi i musiał uciekać przed niebezpieczeństwem aż do Ameryki. Sam pan Konrad został w Toruniu i podczas wojny potajemnie pomagał prześladowanym ludziom.",
 "Po wojnie budynek przybierał nowe oblicza. Czy potrafisz sobie wyobrazić, że w tych pięknych salach mieścił się przez jakiś czas posterunek milicji? Później wprowadzili się tu studenci do akademika Uniwersytetu Mikołaja Kopernika, a w jednym z mieszkań żył słynny architekt Zbigniew Wahl, który zaprojektował toruński dworzec autobusowy.",
 "Dom pana Konrada przez lata zaniedbań niszczał i prawie zamienił się w ruinę. Dzisiaj, po wielkim i trudnym remoncie, znów tętni życiem. W części pod numerem 50 powstał Kulturalny hub Bydgoskiego Przedmieścia, dzielący przestrzeń z Książnicą Kopernikańską. W numerze 52 siedzibę znalazły Zakład Aktywności Zawodowej, Dzienny Dom Pobytu Seniora oraz Toruńskie Laboratorium Miejskie."],
 z:[{t:"tekst",q:"Rozejrzyj się wokół wejścia do Kulturalnego hubu. Jak myślisz, które elementy budynku pamiętają jeszcze czasy pana Konrada, a które wyglądają na zupełnie nowe?"},
    {t:"liczba",q:"Policz, ile dużych okien znajduje się na parterze kamienicy pod numerem 50-52. To Twój pierwszy zdobyty klucz do zagadek Bydgoskiego Przedmieścia."}],
 f:{s:"img/01-hub-dzis.jpg",c:"Kulturalny hub, ul. Bydgoska 50-52 — stan dzisiejszy."},
 fh:[{s:"img/01-hub-dawniej.jpg",c:"Dom Konrada Schwartza na fotografii z epoki."},
     {s:"img/01-konrad-schwartz.jpg",c:"Konrad Schwartz. Fot. z archiwum rodzinnego Eda Grube, za nowosci.com.pl."},
     {s:"img/01-hol-rycina.jpg",c:"„Diele des Landhauses Schwartz in Thorn” — hol domu na rycinie z epoki. Ten sam hol zobaczysz dziś, wchodząc do hubu."}],
 g:[]},

{n:2,x:540,y:412,skrz:"Róg ul. Bydgoskiej i ul. Konopnickiej",adres:"ul. Bydgoska 42",
 trasa:"Kieruj się na wschód, w stronę zespołu staromiejskiego. Bądź czujny — kolejny punkt jest bliżej, niż myślisz. Jeśli dopisze Ci szczęście, u celu ujrzysz trzy żabie murale lokalnego artysty, Andrzeja Po Prostu.",
 rozp:"Murowana kamienica narożna z przedogródkiem — pasem zieleni od strony ulicy Bydgoskiej.",
 hist:["Kamienica znajduje się w obszarze, który prężnie rozwijał się w drugiej połowie XIX wieku. W 1871 roku Toruń został podniesiony do rangi twierdzy I kategorii, co poskutkowało zakazem budowania na Bydgoskim Przedmieściu zabudowy innej niż drewniana. Rozejrzyj się — wokół wciąż stoi drewniana zabudowa, świadek tej części historii miasta. Prawo zniesiono w 1909 roku, dając tym samym początek kamienicy, przed którą stoisz. W marcu 1909 roku piekarz Gustaw Sodtke podjął decyzję o jej wybudowaniu.",
 "Prawo narzucało konieczność stworzenia przed budynkiem tak zwanego przedogródka, czyli niezabudowanego pasa zieleni od strony ulicy. Czy jesteś w stanie go odnaleźć? Od początku kamienica miała dwie funkcje: mieszkalną i usługową. Na parterze mieściła się między innymi piekarnia właściciela z wielkim piecem i elektryczną ugniatarką do ciasta. Projekt zakładał również pralnię i stajnię.",
 "Czy wiesz, w jaki sposób chronione są zabytki w Polsce? Jedną z form ochrony jest Rejestr zabytków. Kamienicę wpisano do niego 8 września 2015 roku pod numerem A/1679. Litera A nie jest przypadkowa — dokumentację prowadzi się w trzech zbiorach: A dla zabytków nieruchomych, B dla ruchomych, C dla archeologicznych. Omawiany wcześniej budynek przy Bydgoskiej 50-52 też jest w rejestrze — wpis pochodzi z 1983 roku. Szukaj na elewacjach Błękitnej Tarczy, międzynarodowego symbolu ochrony zabytków."],
 z:[{t:"liczba",q:"Przejdź wzdłuż elewacji przy ul. Bydgoskiej oraz Konopnickiej. Policz drzwi wejściowe."},
    {t:"tekst",q:"Zapamiętaj i zapisz, jakie dekoracje zdobią te drzwi."}],
 f:{s:"img/02-bydgoska-42.jpg",c:"Kamienica przy ul. Bydgoskiej 42 — stan dzisiejszy. Szczyt z ciemnymi belkami na jasnym tynku, balkony od strony ulicy."},
 fh:[{s:"img/02-parkstrasse.jpg",c:"„Thorn — Parkstrasse (Bromberger Vorstadt)”: dzisiejsza ul. Konopnickiej na dawnej pocztówce. Źródło: fotopolska.eu."},
     {s:"img/blekitna-tarcza.png",mini:1,c:"Błękitna Tarcza — międzynarodowy znak ochrony zabytków. Takiej tabliczki szukaj na elewacjach."}],
 g:["kamienica"]},

{n:3,x:568,y:452,skrz:"Róg ul. Bydgoskiej i ul. Konopnickiej",adres:"ul. Bydgoska 40",
 trasa:"Rozejrzyj się. Odszukaj drewniany budynek naprzeciwko miejsca, w którym stoisz.",
 rozp:"Drewniana willa w konstrukcji szachulcowej, z ciemnymi belkami na jasnym tynku i wieżyczką.",
 hist:["Czy pamiętasz informacje z poprzedniego przystanku? Stoisz właśnie pod zabytkiem będącym idealnym przykładem budownictwa drewnianego wznoszonego w latach 1871–1909. Projektem zajęła się firma budowlana Houterman & Walter, a pozwolenie na budowę wydano w grudniu 1895 roku.",
 "Budynek wzniesiono w stylu eklektycznym, w konstrukcji szachulcowej z wypełnieniem ceglanym. Do Rejestru Zabytków trafił w 1983 roku."],

/* ————— stan ————— */
let view="start", cur=0;
const ans={}, fotos={};
let imie="", notatki="";
const K=(p,i)=>p+"-"+i;

/* ————— zapis w przeglądarce —————
   Odpowiedzi przeżywają zamknięcie karty. Kluczowe przy zadaniach ze zdjęciem:
   przełączenie do aparatu potrafi ubić kartę w tle, dlatego zrzucamy stan
   również na visibilitychange. Zdjęcia trafiają do localStorage po zmniejszeniu
   (patrz pic()) — surowe z aparatu wysadziłyby limit ~5 MB przy pierwszym. */
const LS="paszport-odkrywcy-v1";
let jestZapis=false, blokadaZapisu=false, zapisT=null;

/* Tryb prywatny i plik otwarty prosto z dysku (file://) potrafią blokować
   localStorage. Sprawdzamy to raz na starcie, żeby ekran startowy nie obiecywał
   zapisu, którego nie będzie. */
const zapisDostepny=(()=>{
  try{ localStorage.setItem(LS+"-test","1"); localStorage.removeItem(LS+"-test"); return true }
  catch(e){ return false }
})();

function zapisz(){
  if(!zapisDostepny)return;
  try{
    localStorage.setItem(LS,JSON.stringify({ans,fotos,imie,notatki,cur}));
    blokadaZapisu=false;
  }catch(e){ blokadaZapisu=true }
}
function zapiszWkrotce(){clearTimeout(zapisT);zapisT=setTimeout(zapisz,400)}
function wczytaj(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(LS)||"null") }catch(e){ return }
  if(!d)return;
  Object.assign(ans,d.ans||{});
  Object.assign(fotos,d.fotos||{});
  imie=d.imie||""; notatki=d.notatki||"";
  cur=Math.min(Math.max(0,d.cur|0),P.length-1);
  jestZapis=Object.keys(ans).length>0||Object.keys(fotos).length>0||!!imie||!!notatki;
}
function odNowa(){
  if(!confirm("Skasować wszystkie odpowiedzi i zacząć grę od nowa?\n\nTej operacji nie da się cofnąć."))return;
  for(const k in ans)delete ans[k];
  for(const k in fotos)delete fotos[k];
  imie="";notatki="";cur=0;jestZapis=false;blokadaZapisu=false;
  clearTimeout(zapisT);
  try{localStorage.removeItem(LS)}catch(e){}
  show("start");
}
const ostrzezenieZapisu=()=>blokadaZapisu?`<div class="uwaga"><b>Nie udało się zapisać zdjęcia w przeglądarce</b> — pamięć jest pełna.
  Odpowiedzi działają w tej sesji, ale mogą nie przetrwać zamknięcia karty. Usuń jedno ze zdjęć albo pokaż paszport w recepcji teraz.</div>`:"";

document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(zapisT);zapisz()}});
window.addEventListener("pagehide",()=>{clearTimeout(zapisT);zapisz()});

/* ————— widoki ————— */
const el=()=>document.getElementById("view");
function show(v,i){view=v;if(i!==undefined)cur=i;zapiszWkrotce();render();window.scrollTo({top:0,behavior:"instant"})}
function go(d){
  if(view==="mapa"){show("punkt");return}
  if(view==="punkt"){
    if(cur+d<0){show("start");return}
    if(cur+d>=P.length){show("koniec");return}
    show("punkt",cur+d);return}
  if(view==="koniec"&&d<0){show("punkt",P.length-1)}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fig(o){return o?`<figure class="f${o.mini?" mini":""}"><img src="${o.s}" alt="${esc(o.c)}" loading="lazy">
    <figcaption>${o.c}</figcaption></figure>`:""}
function done(pi){const p=P[pi];return p.z.every((z,i)=>z.t==="foto"?!!fotos[K(pi,i)]:(ans[K(pi,i)]||"").trim()!=="")}
const nDone=()=>P.filter((_,i)=>done(i)).length;

function vStart(){
  return `<div class="trasa"><b>Punkt startowy:</b> Kulturalny hub, ul. Bydgoska 50-52</div>
  <div class="cover">
    <p style="font-size:16.5px;text-align:left;margin:6px 0 0">Witaj, Odkrywco! Przed Tobą samodzielna gra terenowa po jednej z najpiękniejszych i najbardziej klimatycznych dzielnic Torunia. Znajdziesz tu unikalne kamienice, ryglowe konstrukcje i architektoniczne detale z przełomu XIX i XX wieku.</p>
    ${fig({s:"img/99-pocztowka.jpg",c:"Bydgoskie Przedmieście na dawnej pocztówce — narożnik domu Konrada Schwartza przy ul. Bydgoskiej 50-52, od którego zaczyna się trasa. Źródło: fotopolska.eu."})}
    <p class="mikro">Zasady gry</p>
    <ol class="zasady">${ZASADY.map(z=>`<li>${z}</li>`).join("")}</ol>
    ${jestZapis
      ?`<button class="cta" onclick="show('punkt',${cur})">Wróć do gry · przystanek ${cur+1}</button>
        <button class="cta gh" onclick="odNowa()">Zacznij od nowa</button>`
      :`<button class="cta" onclick="show('punkt',0)">Zacznij grę · 12 przystanków</button>`}
    <button class="cta gh" onclick="show('mapa')">Zobacz trasę na mapie</button>
    <div class="uwaga" style="text-align:left">${zapisDostepny
      ?"Odpowiedzi zapisują się same w tej przeglądarce — możesz zamknąć kartę i wrócić później, nic nie przepadnie. Skasuje je tryb prywatny albo wyczyszczenie danych przeglądarki."
      :"Ta przeglądarka nie pozwala zapisać odpowiedzi — najczęściej dlatego, że plik jest otwarty prosto z dysku albo działa tryb prywatny. Nie zamykaj karty w trakcie spaceru."}
      Trasa jest pętlą: zaczynasz i kończysz przy Bydgoskiej 50.</div>
  </div>`;
}

  const st=P.map(p=>{
    const d=done(p.n-1), here=p.n-1===cur;
    return `<g class="stop" tabindex="0" role="button" aria-label="Przystanek ${p.n}, ${esc(p.adres||p.skrz)}"

      <circle cx="${p.x}" cy="${p.y}" r="${here?16:13}" fill="${d?'#007FFF':(here?'#312D2A':'#DACDBA')}" stroke="${here?'#007FFF':'#312D2A'}" stroke-width="${here?3:1.5}"/>
      <text x="${p.x}" y="${p.y+4.5}" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="12" font-weight="600"

  return `<div class="trasa">Schemat trasy · kolejność ma znaczenie</div>
  <div class="pad">
  <svg class="tr" viewBox="0 0 700 520" role="img" aria-label="Schemat trasy gry">
    <g stroke="#C9BAA3" stroke-width="26" stroke-linecap="round">
      <line x1="60" y1="76" x2="640" y2="76"/><line x1="60" y1="430" x2="660" y2="430"/>
      <line x1="112" y1="76" x2="112" y2="430"/><line x1="300" y1="76" x2="300" y2="430"/>
      <line x1="578" y1="76" x2="578" y2="430"/><line x1="300" y1="290" x2="640" y2="290"/>
    </g>
    <ellipse cx="70" cy="474" rx="72" ry="30" fill="#CBD6BC"/>
    <g font-family="ui-sans-serif,system-ui" font-size="11" fill="#8B7B65" letter-spacing="1.6">
      <text x="352" y="60">UL. MICKIEWICZA</text>
      <text x="360" y="470">UL. BYDGOSKA</text>
      <text x="392" y="278">UL. KRASIŃSKIEGO</text>
      <text x="60" y="500" fill="#5C7A4A">PARK MIEJSKI</text>
      <text x="596" y="500" text-anchor="end" fill="#7A4A3A">→ STARÓWKA</text>
      <text transform="rotate(-90 74 260)" x="74" y="260">UL. SIENKIEWICZA</text>
      <text transform="rotate(-90 262 262)" x="262" y="262">UL. KLONOWICA</text>
      <text transform="rotate(-90 540 250)" x="540" y="250">UL. KONOPNICKIEJ</text>
    </g>
    <polyline fill="none" stroke="#312D2A" stroke-width="2" stroke-dasharray="6 6" opacity=".45"
      points="${P.map(p=>p.x+","+p.y).join(" ")} 430,430"/>
    ${st}
  </svg>
  <div class="legend">
    <span><i style="background:#312D2A"></i>tu jesteś</span>
    <span><i style="background:#007FFF"></i>zrobione</span>
    <span><i style="background:#DACDBA;border:1px solid #312D2A"></i>przed Tobą</span>
  </div>
  <button class="cta" onclick="show('punkt')">Wróć do przystanku ${cur+1}</button>
  </div>`;
}

function vPunkt(){
  const p=P[cur], pi=cur;
  const zad=p.z.map((z,i)=>{
    const k=K(pi,i), v=esc(ans[k]||"");
    let f="";
    if(z.t==="liczba")f=`<input type="number" inputmode="numeric" placeholder="wpisz liczbę" value="${v}" oninput="ans['${k}']=this.value;bump();zapiszWkrotce()">`;
    else if(z.t==="tekst")f=`<textarea placeholder="Twoja odpowiedź…" oninput="ans['${k}']=this.value;bump();zapiszWkrotce()">${v}</textarea>`;
    else if(z.t==="wybor")f=`<div class="wyb">${z.o.map(o=>`<button aria-pressed="${ans[k]===o}" onclick="ans['${k}']=${JSON.stringify(o).replace(/"/g,'&quot;')};zapisz();render()">${o}</button>`).join("")}</div>`;
    else if(z.t==="foto")f=`<div class="foto">
        <label>${fotos[k]?"Zmień zdjęcie":"Zrób zdjęcie"}<input type="file" accept="image/*" capture="environment" onchange="pic('${k}',this)"></label>
        ${fotos[k]?`<img src="${fotos[k]}" alt="Twój rysunek"><button class="del" onclick="delpic('${k}')">usuń</button>`:""}</div>`;
    return `<div class="q"><span class="qn">Zadanie ${i+1} z ${p.z.length}</span><p>${z.q}</p>${f}</div>`;
  }).join("");
  const slow=p.g.length?`<div class="slow"><b>Słowniczek</b><dl>${p.g.map(g=>`<dt>${g[0].toUpperCase()+g.slice(1)}</dt><dd>${G[g]}</dd>`).join("")}</dl></div>`:"";
  const q=encodeURIComponent((p.adres||p.skrz)+", Toruń");
  return `<div class="trasa"><b>Trasa:</b> ${p.trasa}</div>
  <div class="pad">
    <p class="addr">Przystanek ${p.n} z 12${p.adres?" · "+p.adres:""}</p>
    <h2 class="pt">${p.skrz}</h2>
    <div class="rozp"><b>Jak rozpoznać budynek</b>${p.rozp}${p.uw?`<br><span style="color:var(--ceg)">${p.uw}</span>`:""}
      ${p.f?`<details class="pod"><summary>Nie mogę znaleźć — pokaż zdjęcie</summary>${fig(p.f)}</details>`:""}</div>
    <a class="cta gh" style="text-decoration:none;text-align:center" target="_blank" rel="noopener"
       href="https://www.google.com/maps/search/?api=1&query=${q}">Otwórz w mapach</a>
    <details class="rys"><summary>Jestem na miejscu — pokaż historię</summary>
      <p class="mikro">Rys historyczny budynku</p>
      <div class="hist">${p.hist.map(h=>`<p>${h}</p>`).join("")}</div>
      ${(p.fh||[]).map(fig).join("")}
    </details>
    <p class="mikro">Kącik detektywa</p>
    ${ostrzezenieZapisu()}
    <div class="zad">${zad}</div>
    ${slow}
  </div>`;
}

function vKoniec(){
  const rows=P.map((p,pi)=>p.z.map((z,i)=>{
    const k=K(pi,i), v=(ans[k]||"").trim();
    const val=z.t==="foto"?(fotos[k]?`<img src="${fotos[k]}" alt="rysunek">`:`<span class="pusto">bez zdjęcia</span>`)
      :(v?esc(v):`<span class="pusto">brak odpowiedzi</span>`);
    return `<div class="sumq"><div class="k">${p.n}. ${esc(p.adres||p.skrz)}</div><div class="v">${val}</div></div>`;
  }).join("")).join("");
  return `<div class="trasa"><b>Trasa:</b> udaj się w miejsce startu gry — ul. Bydgoska 50</div>
  <div class="pad">
    <h2 class="pt">Ostatnia misja</h2>
    <p>Twoje wielkie śledztwo pośród tajemniczych kamienic i ukrytych symboli dobiegło końca. Udało Ci się rozszyfrować wszystkie zagadki!</p>
    <p>Udaj się do recepcji Kulturalnego hubu Bydgoskiego Przedmieścia i przedstaw odpowiedzi na wszystkie napotkane po drodze pytania. Czeka tam na Ciebie zasłużona nagroda Mistrza Historii Bydgoskiego Przedmieścia. Dziękujemy za wspólną podróż przez historię i architekturę Bydgoskiego Przedmieścia!</p>
    <p>Oddanie paszportu to świetny moment na sprawdzenie naszej oferty kulturalnej. Czekają na Ciebie m.in. twórcze warsztaty, spotkania autorskie, wystawy, koncerty i wiele więcej.</p>
    ${fig({s:"img/99-hub-wnetrze.jpg",c:"Hol Kulturalnego hubu po remoncie — ten sam, który widziałeś na rycinie z epoki na pierwszym przystanku."})}

    <div class="cert">
      <h3>Certyfikat Odkrywcy<br>Bydgoskiego Przedmieścia</h3>
      <p class="sub">Kulturalny hub · ul. Bydgoska 50</p>
      <p class="txt">Za udział i rozwiązanie wszystkich zagadek w grze miejskiej „Paszport Odkrywcy Bydgoskiego Przedmieścia”, zorganizowanej w ramach wakacji w Kulturalnym hubie Bydgoskiego Przedmieścia w Toruniu.</p>
      <p class="txt">Oficjalnie ogłaszam, że ja, Detektyw:</p>
      <input type="text" placeholder="Twoje imię" value="${esc(imie)}" oninput="imie=this.value;zapiszWkrotce()">
      <p class="cap">Imię Odkrywcy</p>
      <p class="txt">przeszedłem zakątki Bydgoskiego Przedmieścia, odkryłem tajemnice dawnych architektów, poznałem niesamowite losy mieszkańców i od dziś noszę tytuł <b>Mistrza Historii</b> tej części Torunia!</p>
      <p style="font-size:15px;margin:0">Ukończono ${nDone()} z 12 przystanków</p>
    </div>

    <div class="uwaga">Odpowiedzi sprawdza recepcja hubu — ta strona ich nie ocenia. Pokaż poniższe podsumowanie przy odbiorze nagrody.</div>
    ${ostrzezenieZapisu()}
    <p class="mikro">Twoje odpowiedzi</p>
    <div class="sumbox">${rows}</div>

    <p class="mikro">Notes Odkrywcy</p>
    <p style="font-size:14.5px;margin:0 0 8px">Miejsce na Twoje dodatkowe spostrzeżenia, uwagi i notatki z trasy.</p>
    <textarea placeholder="Co jeszcze zwróciło Twoją uwagę?" oninput="notatki=this.value;zapiszWkrotce()">${esc(notatki)}</textarea>

    <details class="rys" style="margin-top:18px"><summary>Skąd to wiemy — źródła</summary>
      <div class="zrodla">
        <b>Netografia</b>
        toruntour.pl · fotopolska.eu · zabytek.pl (Białe Karty Zabytków) · nid.pl/zasoby/rejestr-zabytkow-zasoby ·
        gov.pl/web/wuoz-olsztyn/znak-zabytek-chroniony-prawem · stotom.wordpress.com · pl.wikipedia.org · tak.torun.pl/hub
        <b>Ikonografia</b>
        Fotografie i pocztówki archiwalne: fotopolska.eu, toruntour.pl.
        Portret Konrada Schwartza: archiwum rodzinne Eda Grube, za nowosci.com.pl.
        Projekt elewacji kamienicy przy ul. Konopnickiej 24 z 1903 r.: Biała Karta Zabytku, Archiwum Państwowe w Toruniu, sygn. G1726, k. 18.
        Rycina holu domu Schwartza: „Diele des Landhauses Schwartz in Thorn”, architekci Erdmann &amp; Spindler, Berlin.
        <b>Treść</b>
        Toruńska Agenda Kulturalna · Kulturalny hub Bydgoskiego Przedmieścia. Opracowanie: Zuzanna Falleńczyk.
        <b>Wersja cyfrowa</b>
        Fundacja Lucid Academy — <a href="https://lucidacademy.pl" target="_blank" rel="noopener">lucidacademy.pl</a>.
        Robimy cyfrowe narzędzia dla miast, instytucji kultury i szkół.
      </div>
    </details>

    <button class="cta gh" onclick="show('punkt',0)">Wróć do trasy</button>
    <p style="font-size:13.5px;color:var(--ink2);margin:22px 0 0;text-align:left">Paszport oddany i nagroda odebrana? Wyczyść odpowiedzi, żeby następny Odkrywca zaczął od czystej karty — szczególnie jeśli gracie na wspólnym telefonie.</p>
    <button class="cta gh" onclick="odNowa()">Wyczyść i zacznij od nowa</button>
  </div>`;
}

function render(){
  const v=document.getElementById("view");
  v.innerHTML=view==="start"?vStart():view==="mapa"?vMapa():view==="punkt"?vPunkt():vKoniec();
  const nav=document.getElementById("nav");
  nav.hidden=(view==="start");
  if(!nav.hidden){
    document.getElementById("midn").textContent=view==="punkt"?(cur+1):"—";
    document.getElementById("bPrev").textContent=view==="mapa"?"← Przystanek":"← Wstecz";
    document.getElementById("bNext").textContent=view==="punkt"&&cur===P.length-1?"Zakończ →":(view==="koniec"?"—":"Dalej →");
    document.getElementById("bNext").disabled=(view==="koniec");
    bump();
  }
  document.getElementById("stopka").innerHTML=
    `<p>Treść gry: Toruńska Agenda Kulturalna · Kulturalny hub Bydgoskiego Przedmieścia<br>opracowanie: Zuzanna Falleńczyk</p>
     <div class="sygnwrap"><a class="sygn" href="https://lucidacademy.pl" target="_blank" rel="noopener">
       <img src="img/lucid-academy.png" alt="Lucid Academy" width="52" height="36">
       <span>Wersja cyfrowa: demo techniczne<br><b>Fundacja Lucid Academy</b><br><u>lucidacademy.pl</u></span>
     </a></div>`;
}
function bump(){const b=document.getElementById("progbar");if(b)b.style.width=(nDone()/P.length*100)+"%"}
/* Zdjęcie z aparatu ma 2–5 MB; miniaturka w podsumowaniu ma 76 px. Zmniejszamy do
   1000 px / JPEG 0.7 (~150 KB) — mieści się w localStorage i nie zamula DOM-u. */
function pic(k,inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const src=e.target.result, im=new Image();
    im.onload=()=>{
      const sk=Math.min(1,1000/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.round(im.width*sk); c.height=Math.round(im.height*sk);
      const g=c.getContext("2d");
      g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
      g.drawImage(im,0,0,c.width,c.height);
      try{ fotos[k]=c.toDataURL("image/jpeg",.7) }catch(err){ fotos[k]=src }
      zapisz(); render();
    };
    im.onerror=()=>{fotos[k]=src;zapisz();render()};
    im.src=src;
  };
  r.readAsDataURL(f);
}
function delpic(k){delete fotos[k];zapisz();render()}
wczytaj();
render();
</script>
